# Stack Docker de expo-apps. Dockhand donne ensuite une UI web pour
# ajouter/gerer d'autres services (Gitea, Bastion...) sans avoir a toucher
# a ce fichier a la main - mais rien n'empeche de les ajouter ici aussi.
services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

  webui:
    build: ./webui
    container_name: expolab-webui
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      # Socket Incus de l'hote, deja remonte jusqu'ici par le profil
      # expo-apps (voir incus/profiles/expo-apps.yaml) - la webui pilote
      # Incus directement au travers de ces deux montages en cascade.
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      # fleet/ pousse par apps/deploy-apps.sh : la webui edite
      # inventory.yaml et invoque deploy-fleet.sh, la meme source de
      # verite que la ligne de commande.
      - /opt/expolab/fleet:/expolab/fleet

volumes:
  dockhand_data:
