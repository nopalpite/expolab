# Profil Incus applique a chaque "faux Raspberry Pi" de la flotte.
# Applique/mis a jour automatiquement par network-setup.sh.
config:
  limits.cpu: "1"
  limits.memory: 512MiB
  limits.memory.enforce: soft
description: Faux Raspberry Pi expolab (reseau LAN simule isole + ressources contraintes)
devices:
  eth0:
    name: eth0
    network: expo-lan
    type: nic
  root:
    path: /
    # Pool dedie en copie-sur-ecriture (btrfs, cree par network-setup.sh sur
    # un fichier loop - pas de repartitionnement de la carte SD) plutot que
    # "default" (driver "dir") : ce dernier duplique integralement l'image
    # de base a chaque instance (~1,7 Gio/faux Pi observe en pratique), et
    # la carte SD de 15 Gio du lab sature apres seulement 7-8 machines,
    # cassant silencieusement le provisioning en cours (ecritures qui
    # echouent, ex: config reseau) - voir l'incident documente dans
    # l'historique du projet. btrfs partage l'image de base entre toutes
    # les instances, ne stockant que leurs differences.
    pool: fake-pi-pool
    type: disk
name: fake-pi
