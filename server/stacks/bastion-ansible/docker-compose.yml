# Stack Dockhand "bastion-ansible" - execute site.yml (depot separe
# github.com/nopalpite/bastion-ansible) contre le parc reference dans
# Bastion. Pas de demon : ce conteneur execute le playbook puis s'arrete
# - chaque redeploiement de cette stack (via deploy-server.sh) = une
# execution (modele "declenchement manuel" retenu pour le runner, voir
# le README de bastion-ansible).
#
# network_mode: host - necessaire pour joindre Bastion en direct
# (127.0.0.1:5000, pas de resolution DNS *.web.expolab.lan requise, meme
# raison que caddy-admin) ET pour atteindre expo-lan (10.42.0.0/24, ou
# vivent les machines listees dans Bastion) - le reseau bridge Docker
# par defaut n'a de route vers aucun des deux.
services:
  bastion-ansible:
    image: ghcr.io/nopalpite/bastion-ansible:latest
    container_name: expolab-bastion-ansible
    network_mode: host
    env_file:
      - ${REPO_ROOT}/server/stacks/bastion-ansible/bastion-ansible.env
    environment:
      # Uniquement pour ce lab : les faux Pi sont recrees souvent
      # (nouvelle cle hote a chaque fois), la verification stricte
      # d'ansible.cfg y serait juste une nuisance permanente - pas touche
      # a la valeur par defaut du vrai outil (securisee, voulue pour la
      # vraie prod), seulement surchargee ici pour cette stack.
      - ANSIBLE_HOST_KEY_CHECKING=false
      # Bastion n'expose pas de nom d'utilisateur SSH dans /api/machines
      # (uniquement id/name/host/os/site/ssh_port/tags) - Ansible se
      # rabat donc sur root par defaut, qui n'existe pas sur les faux Pi
      # (utilisateur "pi", voir fleet/provision-fakepi.sh). Fige ici pour
      # ce lab ou tout le monde est "pi" ; un vrai parc heterogene (users
      # differents par machine) demanderait que Bastion expose ce champ
      # dans son API plutot qu'une valeur globale comme celle-ci.
      - ANSIBLE_REMOTE_USER=pi
    volumes:
      # Cle SSH dediee automatisation (voir deploy-server.sh) - jamais
      # celle utilisee en vrai vie, une cle propre au lab.
      - ${REPO_ROOT}/server/stacks/bastion-ansible/secrets:/repo/secrets:ro
    # site.yml utilise "become: true" (escalade sudo) - "raspberry" est
    # le mot de passe "pi" par defaut de tout ce lab, deja en clair
    # ailleurs (ex: BASTION_ADMIN_PASSWORD dans bastion/docker-compose.yml).
    # Un vrai parc utiliserait plutot des vars chiffrees (Ansible Vault)
    # ou du sudo NOPASSWD sur la cle "automatisation" - hors-scope ici.
    command: ["--extra-vars", "ansible_become_pass=raspberry"]

  # UI web (roles, declenchement de runs, historique) - meme image,
  # entrypoint different (webui/app.py au lieu de ansible-playbook direct).
  # Exposee via Caddy (services.yaml) contrairement au runner ci-dessus,
  # qui n'a pas d'interface. Memes raisons de network_mode: host.
  bastion-ansible-webui:
    image: ghcr.io/nopalpite/bastion-ansible:latest
    container_name: expolab-bastion-ansible-webui
    restart: unless-stopped
    network_mode: host
    entrypoint: ["python3", "webui/app.py"]
    env_file:
      - ${REPO_ROOT}/server/stacks/bastion-ansible/bastion-ansible.env
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=false
      - ANSIBLE_REMOTE_USER=pi
      # Meme raison que le "command" du runner ci-dessus, mais pour les
      # runs que l'UI declenche elle-meme (voir BASTION_ANSIBLE_EXTRA_ARGS
      # dans le README de bastion-ansible).
      - BASTION_ANSIBLE_EXTRA_ARGS=--extra-vars ansible_become_pass=raspberry
    volumes:
      - ${REPO_ROOT}/server/stacks/bastion-ansible/secrets:/repo/secrets:ro
      # Lecture-ecriture (contrairement au runner) : l'UI edite les
      # roles et ecrit l'historique des runs. roles/ est vide au premier
      # demarrage - seede automatiquement depuis /opt/roles-seed (bake
      # dans l'image) par webui/app.py.
      - ${REPO_ROOT}/server/stacks/bastion-ansible/roles:/repo/roles:rw
      - ${REPO_ROOT}/server/stacks/bastion-ansible/runs:/repo/runs:rw
