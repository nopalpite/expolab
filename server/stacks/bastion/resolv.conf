# Resolveur DNS du conteneur Bastion (monte par docker-compose.yml) : dnsmasq
# de l'expo, et non celui de l'hote. dnsmasq connait le nom de chaque machine
# (annonce dans sa demande DHCP) et repond au DNS inverse (10.42.0.x ->
# <nom>.expolab.lan) : c'est ce que le scan reseau de Bastion utilise pour
# nommer les machines. Le reste est transmis aux resolveurs de l'hote.
nameserver 10.42.0.1
search expolab.lan
