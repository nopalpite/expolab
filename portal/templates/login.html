<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>expolab · Connexion</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<main class="login-card">
  <h1>expolab</h1>
  <p class="muted">Un seul accès pour tous les services.</p>
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Identifiant</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="primary">Se connecter</button>
  </form>
  {% if tls_mode == "internal" %}
  <p class="muted small">Certificat non reconnu ? <a href="/ca.crt">Télécharge le certificat racine</a> et installe-le une fois dans ton navigateur.</p>
  {% endif %}
</main>
</body>
</html>
