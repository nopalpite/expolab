# DHCP + DNS pour le reseau simule expo-lan.
# Pousse dans /etc/dnsmasq.d/expolab.conf par provision-gateway.sh.
interface=eth0
domain=expolab.lan
expand-hosts

# Plage dediee, distincte de celle qu'Incus utilisait par defaut
# (10.42.0.181-254) pour eviter tout conflit de bail lors de la transition.
dhcp-range=10.42.0.100,10.42.0.250,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.10

# Nom public du reverse-proxy : *.web.expolab.lan pointe toujours vers
# expo-gw (Caddy), jamais vers l'IP reelle du faux Pi - sinon un client
# resolvant "pi-01.expolab.lan" (l'enregistrement DHCP automatique
# ci-dessus, qui pointe vers la vraie IP de pi-01) contournerait Caddy et
# tenterait de se connecter en HTTPS directement sur pi-01, qui n'ecoute
# que sur le port 80 (nginx).
address=/web.expolab.lan/10.42.0.10

# Upstream separe pour eviter une boucle (voir resolv.dnsmasq.upstream).
resolv-file=/etc/resolv.dnsmasq.upstream
no-resolv

log-dhcp
