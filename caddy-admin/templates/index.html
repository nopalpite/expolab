<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>expolab - caddy</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Caddy</h1>
        <p class="subtitle">Services exposes par le reverse-proxy (&lt;nom&gt;.web.expolab.lan)</p>
    </header>

    <main>
        <section class="panel">
            <h2>Ajouter un service</h2>
            <form id="create-form">
                <div class="field">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" placeholder="gitea" required>
                </div>
                <div class="field">
                    <label for="backend_port">Port backend</label>
                    <input type="number" id="backend_port" name="backend_port" placeholder="3030" min="1" max="65535" required>
                    <p id="used-ports-hint" style="margin: 2px 0 0; font-size: 0.78rem; color: var(--error);"></p>
                </div>
                <div class="field" style="flex-basis: 100%;">
                    <label>Routes additionnelles (optionnel)</label>
                    <p class="subtitle" style="margin: 0 0 6px;">Chemin fait suivre vers un autre port AVANT la route principale (ex: pont VNC de Bastion).</p>
                    <div id="extra-routes-list"></div>
                    <button type="button" id="add-route-btn" class="secondary">+ Ajouter une route</button>
                </div>
                <button type="submit" id="create-btn">Ajouter</button>
                <button type="button" id="create-cancel" class="secondary" hidden>Annuler</button>
            </form>
            <p id="create-status" class="status" hidden></p>
        </section>

        <section class="panel">
            <h2>Services actuels</h2>
            <table id="services-table">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>URL</th>
                        <th>Port backend</th>
                        <th>Routes additionnelles</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="services-body">
                    <tr><td colspan="5" class="empty">Chargement...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
