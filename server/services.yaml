# Services applicatifs exposes via le reverse-proxy Caddy.
#
# - name          : label public, utilise dans <name>.web.expolab.lan
# - backend_port  : port du service sur l'hote (tous les services de ce
#                    stack Docker partagent l'hote via network_mode: host
#                    ou une publication de port - donc toujours localhost)
# - backend_host  : (optionnel, defaut "localhost") a ne renseigner que
#                    pour un service qui vivrait ailleurs (ex: un futur
#                    faux Pi si jamais besoin, via <nom>.expolab.lan)
# - extra_routes  : (optionnel) chemins a faire suivre vers un port
#                    different AVANT la route principale - voir
#                    render-caddyfile.py
# - auth          : (optionnel) true = vhost protege par le portail (service
#                    `dashboard`) : session partagee, ou basic auth pour curl
#                    et les clients git. Laisse hors dashboard (le portail
#                    gere sa propre connexion) et bastion (a sa propre
#                    authentification).
# - auth_except   : (optionnel) chemins exemptes d'authentification malgre
#                    auth: true (ex: protocole git HTTP de git-mirror)
# - title, group, icon, description : (optionnels) affichage dans le portail
#                    (tiroir et accueil). icon : box, server, network, globe,
#                    shield, terminal, git, play, download, clock. Sans titre, le nom sert.
# - framed        : (optionnel, defaut true) false = le portail ouvre ce
#                    service dans un nouvel onglet du navigateur au lieu de
#                    l'afficher dans un cadre.
# - portal        : (optionnel) false = service absent du portail.
#
# https://<name>.web.expolab.lan  ->  Caddy  ->  http://<backend_host>:<backend_port>
services:
  - name: dashboard
    backend_port: 3001
  - name: dockhand
    auth: true
    backend_port: 3000
    title: Dockhand
    group: Infrastructure
    icon: box
    description: Conteneurs et stacks
  - name: fleet
    auth: true
    backend_port: 5050
    title: Flotte
    group: Infrastructure
    icon: server
    description: Faux Raspberry Pi
  - name: dnsmasq
    auth: true
    backend_port: 5051
    title: DHCP et DNS
    group: Réseau
    icon: network
    description: Baux et réservations
  - name: caddy
    auth: true
    backend_port: 5052
    title: Caddy
    group: Réseau
    icon: globe
    description: Reverse proxy et TLS
  - name: vpn
    auth: true
    backend_port: 5053
    title: VPN
    group: Réseau
    icon: shield
    description: Pairs WireGuard
  - name: apt-cache
    auth: true
    backend_port: 5056
    title: Cache apt
    group: Réseau
    icon: download
    description: Paquets, journal, miroirs HTTPS
  - name: sd-flasher
    auth: true
    backend_port: 5057
    title: Cartes SD
    group: Infrastructure
    icon: box
    description: Flasher les cartes des machines
  - name: ntp
    auth: true
    backend_port: 5058
    title: Heure
    group: Réseau
    icon: clock
    description: Serveur de temps
  - name: bastion
    backend_port: 5000
    title: Bastion
    group: Automatisation
    icon: terminal
    description: Accès SSH et VNC
    extra_routes:
      # Pont VNC (websockify) de Bastion - a part de son app principale,
      # voir son README section "Derriere un reverse proxy (TLS)".
      - path: /vnc-ws/*
        backend_port: 6080
  - name: git-mirror
    auth: true
    auth_except:
      - /git/*
    backend_port: 5054
    title: git-mirror
    group: Automatisation
    icon: git
    description: Miroirs de dépôts
  - name: ansible-web
    auth: true
    backend_port: 5055
    title: ansible-web
    group: Automatisation
    icon: play
    description: Lancer les playbooks
