# Stack Dockhand "dnsmasq-admin" - baux DHCP actifs (lecture seule) et
# reservations DHCP (lecture-ecriture, via dhcp-hostsfile de dnsmasq -
# voir dnsmasq.conf).
services:
  dnsmasq-admin:
    build: ${REPO_ROOT}/dnsmasq-admin
    container_name: expolab-dnsmasq-admin
    restart: unless-stopped
    ports:
      - "5051:5051"
    volumes:
      - ${REPO_ROOT}/server/stacks/dnsmasq/data:/dnsmasq-data:ro
      - ${REPO_ROOT}/server/stacks/dnsmasq/admin-config:/dnsmasq-admin-config
      # Necessaire pour `docker kill --signal=HUP expolab-dnsmasq` -
      # seule facon de faire relire a dnsmasq son fichier de reservations
      # sans redemarrer le conteneur (voir dnsmasq-admin/app.py).
      - /var/run/docker.sock:/var/run/docker.sock
