# Services applicatifs exposes via le reverse-proxy Caddy d'expo-gw.
#
# - name          : label public, utilise dans <name>.web.expolab.lan
# - backend_host  : (optionnel, defaut = name) hostname du conteneur qui
#                    heberge reellement le service - a renseigner quand
#                    plusieurs services partagent un meme conteneur
#                    (ex: Dockhand + Gitea + Bastion tous sur expo-apps)
# - backend_port  : port d'ecoute du service sur ce conteneur
#
# https://<name>.web.expolab.lan  ->  Caddy  ->  http://<backend_host>.expolab.lan:<backend_port>
services:
  - name: dockhand
    backend_host: expo-apps
    backend_port: 3000
  - name: fleet
    backend_host: expo-apps
    backend_port: 5050

