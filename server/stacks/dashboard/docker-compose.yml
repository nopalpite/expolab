# Stack Dockhand "dashboard" - le portail expolab (voir ../../../portal) :
# point d'entree unique, connexion unique, tiroir de services affiches dans
# des onglets. Il remplace Homepage ; l'adresse reste dashboard.<domaine>.
#
# network_mode: host : Caddy (lui aussi sur l'hote) le joint sur
# 127.0.0.1:3001 (forward_auth + reverse-proxy), et le portail sonde les
# ports des autres services sur 127.0.0.1 pour afficher leur etat. Il n'ecoute
# QUE sur 127.0.0.1 : inaccessible hors de l'hote sans passer par Caddy.
services:
  dashboard:
    build: ${REPO_ROOT}/portal
    container_name: expolab-dashboard
    restart: unless-stopped
    network_mode: host
    env_file:
      # PORTAL_DOMAIN / PORTAL_TLS_MODE : regenere par deploy-server.sh et
      # caddy-admin selon le domaine public actuel (relus a la recreation).
      - ${REPO_ROOT}/server/stacks/dashboard/dashboard.env
      # PORTAL_SECRET : cle de signature des sessions, generee une seule fois.
      - ${REPO_ROOT}/server/stacks/dashboard/portal.env
    volumes:
      # Identifiants d'administration (utilisateur + hash bcrypt), en lecture seule.
      - ${REPO_ROOT}/server/stacks/caddy/auth.env:/config/auth.env:ro
      # Copie de server/services.yaml tenue a jour sur place par deploy-server.sh
      # et caddy-admin (un fichier remplace par renommage resterait perime
      # dans un bind-mount de fichier).
      - ${REPO_ROOT}/server/stacks/dashboard/services.yaml:/config/services.yaml:ro
      # Certificat racine de Caddy (mode internal), propose en telechargement.
      - ${REPO_ROOT}/server/stacks/caddy/data:/caddy-data:ro
