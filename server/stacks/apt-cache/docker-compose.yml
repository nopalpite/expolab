# Stack Dockhand "apt-cache" - cache apt (apt-cacher-ng) pour les machines
# d'expo, voir Dockerfile. Pas de vhost Caddy : c'est un proxy HTTP, pas une
# interface web (l'interface d'administration est la stack apt-cache-admin).
#
# network_mode: host et ecoute sur 10.42.0.1 (hote sur expo-lan) : les
# machines doivent le joindre, contrairement aux UIs d'administration liees a
# 127.0.0.1 - exception assumee, mais jamais sur le reseau physique.
services:
  apt-cache:
    build: ${REPO_ROOT}/server/stacks/apt-cache
    container_name: expolab-apt-cache
    restart: unless-stopped
    network_mode: host
    env_file:
      # APT_CACHE_ADMIN_SECRET : mot de passe de la page d'administration
      # integree d'apt-cacher-ng, genere une fois par deploy-server.sh.
      - ${REPO_ROOT}/server/stacks/apt-cache/apt-cache.env
    volumes:
      # Mode (en ligne / hors ligne) et miroirs HTTPS : un DOSSIER (jamais un
      # fichier seul, qu'un remplacement par renommage laisserait perime),
      # modifie par apt-cache-admin / apt-cache-mode.sh puis relu au
      # redemarrage du conteneur. Non versionne.
      - ${REPO_ROOT}/server/stacks/apt-cache/config:/etc/apt-cacher-ng-expolab:ro
      # Gros et ecrit souvent : a deplacer sur SSD/NVMe plutot que la carte
      # SD si possible (usure). Non versionne, voir .gitignore.
      - ${REPO_ROOT}/server/stacks/apt-cache/data:/var/cache/apt-cacher-ng
      # Journal des requetes conserve d'un redeploiement a l'autre : base des
      # statistiques d'apt-cache-admin.
      - ${REPO_ROOT}/server/stacks/apt-cache/logs:/var/log/apt-cacher-ng
