name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances de test
        run: pip install ruff==0.6.9 pytest==8.3.3 pyyaml==6.0.2 flask==3.0.3 bcrypt==4.2.0 ruamel.yaml==0.18.6

      # Erreurs de syntaxe et noms indefinis/inutilises uniquement : on
      # ne fait pas echouer la CI sur du style dans du code existant.
      - name: Ruff (syntaxe et noms)
        run: ruff check --select E9,F .

      - name: Syntaxe bash
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Validation YAML (compose, services, templates)
        run: |
          python - <<'PY'
          import glob, sys, yaml
          files = (
              glob.glob("server/**/docker-compose.yml", recursive=True)
              + glob.glob("vpn/**/docker-compose.yml", recursive=True)
              + ["server/services.yaml", "fleet/inventory.yaml"]
          )
          bad = 0
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as exc:
                  print(f"{f}: {exc}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Tests Python (rendu Caddyfile)
        run: pytest tests -q

      - name: Test de fumee des modules server/lib
        run: bash tests/test_deploy_libs.sh

      - name: Test du script de preparation de machine (image)
        run: bash tests/test_machine_setup.sh

      - name: Test de la config du cache apt (miroirs HTTPS)
        run: bash tests/test_apt_cache_entrypoint.sh

      - name: Test du changement d'identifiants d'administration
        run: bash tests/test_set_credentials.sh

      - name: Test de l'adresse publique du VPN (Endpoint)
        run: bash tests/test_vpn_endpoint.sh

      - name: Test de la stack ntp (serveur de temps)
        run: bash tests/test_ntp.sh

      - name: Test du nettoyage de Docker (cache de construction)
        run: bash tests/test_docker_cleanup.sh

      - name: Test de la tenue au redemarrage (Incus au boot, dnsmasq attend le pont)
        run: bash tests/test_boot_order.sh

      # Le Caddyfile genere (forward_auth, en-tetes de cadre...) est valide par
      # Caddy lui-meme : une erreur de syntaxe ici couperait tous les services.
      - name: Validation du Caddyfile genere (Caddy)
        run: |
          python server/render-caddyfile.py server/services.yaml internal > "$RUNNER_TEMP/Caddyfile"
          docker run --rm -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
