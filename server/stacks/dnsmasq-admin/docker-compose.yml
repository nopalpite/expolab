# Stack Dockhand "dnsmasq-admin" - baux DHCP actifs (lecture seule),
# reservations DHCP et enregistrements DNS statiques (lecture-ecriture,
# via dhcp-hostsfile/addn-hosts de dnsmasq - voir dnsmasq.conf).
services:
  dnsmasq-admin:
    build: ${REPO_ROOT}/dnsmasq-admin
    container_name: expolab-dnsmasq-admin
    restart: unless-stopped
    ports:
      - "5051:5051"
    volumes:
      - ${REPO_ROOT}/server/stacks/dnsmasq/data:/dnsmasq-data:ro
      - ${REPO_ROOT}/server/stacks/dnsmasq/admin-config:/dnsmasq-admin-config
      # Necessaire pour `docker kill --signal=HUP expolab-dnsmasq` -
      # seule facon de faire relire a dnsmasq ses fichiers de
      # reservations/enregistrements sans redemarrer le conteneur (voir
      # dnsmasq-admin/app.py).
      - /var/run/docker.sock:/var/run/docker.sock
