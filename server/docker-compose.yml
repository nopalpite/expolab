# Stack Docker du "serveur d'expo" - tourne directement sur l'hote (pas
# dans un conteneur Incus). C'est exactement ce qui serait deploye sur le
# vrai serveur de l'exposition : DHCP/DNS, reverse-proxy, et les services
# applicatifs (Dockhand, webui, Bastion, puis Gitea) en conteneurs Docker.
# Incus, lui, ne sert qu'a simuler la flotte de faux Pi - un besoin propre
# au lab, absent en vraie vie.
services:
  dnsmasq:
    build: ./dnsmasq
    container_name: expolab-dnsmasq
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro

  caddy:
    image: caddy:latest
    container_name: expolab-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

  webui:
    build: ../webui
    container_name: expolab-webui
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      # Socket Incus DIRECT sur l'hote - un seul montage (plus le
      # double-hop hote -> conteneur Incus -> conteneur Docker d'avant,
      # ni les histoires de shift= qui allaient avec).
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - ../fleet:/expolab/fleet

  bastion:
    image: ghcr.io/nopalpite/bastion:latest
    container_name: bastion
    restart: unless-stopped
    # network_mode: host, comme dnsmasq/caddy - recommande par le projet
    # lui-meme pour un bastion (memes interfaces/routes que l'hote, pas
    # de surprise de routage vers expo-lan).
    network_mode: host
    env_file:
      - ./bastion.env
    environment:
      - BASTION_ADMIN_USER=admin
      - BASTION_ADMIN_PASSWORD=raspberry
      - BASTION_VNC_WS_PORT=6080
      # TLS termine par Caddy (vhost bastion.web.expolab.lan, voir
      # services.yaml) - chemin a faire suivre pour le pont VNC, "option
      # B" de la section "Derriere un reverse proxy" du README de
      # Bastion. Ne PAS activer BASTION_TLS_SELFSIGNED en plus : les
      # deux approches ne se combinent pas.
      - BASTION_VNC_WS_PATH=/vnc-ws/
      - BASTION_HISTORY_RETENTION_DAYS=30
    volumes:
      - ./bastion/config:/app/config
      - ./bastion/maps:/app/static/uploads/maps

volumes:
  caddy_data:
  caddy_config:
  dockhand_data:
