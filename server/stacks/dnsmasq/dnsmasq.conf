# DHCP + DNS pour le reseau de l'expo (pont expo-lan, voir network/setup.sh). Monte dans le conteneur
# dnsmasq (network_mode: host) par docker-compose.yml.
#
# Pas de "resolv-file" dedie : le conteneur tourne en network_mode: host et
# monte le /etc/resolv.conf REEL de l'hote (voir docker-compose.yml) - donc
# dnsmasq utilise directement les memes resolveurs amont que l'hote lui-meme,
# sans avoir a les detecter/dupliquer separement.
interface=expo-lan
bind-interfaces
domain=expolab.lan
expand-hosts

# Plage dynamique ; 10.42.0.2-99 restent libres pour des adresses fixes.
# Bail COURT (2 min, le minimum de dnsmasq) pour les adresses de cette plage : une
# carte de remplacement qui recoit une IP de repli (son adresse reservee etant encore
# tenue par la carte morte) la redemande au bout d'une minute ; dnsmasq refuse, et elle
# repart sur son adresse reservee. Les machines RESERVEES ont leur propre bail long
# (12 h), ecrit sur chaque ligne de reservations.conf par dnsmasq-admin.
# A savoir : un appareil NON reserve (portable d'admin, point d'acces) perd son adresse
# apres 2 min de panne de dnsmasq - lui donner une reservation s'il doit tenir.
dhcp-range=10.42.0.100,10.42.0.250,2m
# Seul serveur DHCP du reseau : une machine qui redemande un bail que dnsmasq
# ne connait plus (bail libere, carte remplacee) recoit un refus immediat et
# repart sur une negociation complete, au lieu d'attendre la fin de son bail.
dhcp-authoritative
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# Serveur de temps (stack ntp, voir server/lib/ntp.sh) : une carte neuve
# a une horloge fausse et sans internet rien d'autre ne la corrige.
dhcp-option=option:ntp-server,10.42.0.1

# Emplacement explicite (deja la valeur par defaut, mais explicite pour
# documenter l'intention) du fichier de baux - monte en volume persistant
# (voir docker-compose.yml) pour survivre a une recreation du conteneur.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Reservations DHCP (MAC -> IP fixe), gerees depuis dnsmasq-admin
# (https://dnsmasq.web.expolab.lan) - fichier separe du conf principal
# expres : dnsmasq le relit a chaud sur SIGHUP (`docker kill
# --signal=HUP expolab-dnsmasq`), pas besoin de redemarrer le conteneur
# ni de toucher au bail DHCP ou au cache DNS en cours pour le reste de la
# flotte.
dhcp-hostsfile=/etc/dnsmasq.d/reservations.conf

# Nom public du reverse-proxy : *.web.expolab.lan pointe toujours vers
# l'hote (10.42.0.1, ou tourne Caddy en network_mode: host), jamais vers
# l'IP reelle d'une machine - sinon un client resolvant "pi-01.expolab.lan"
# (l'enregistrement DHCP automatique ci-dessus, qui pointe vers la vraie IP
# de pi-01) contournerait Caddy et tenterait de se connecter en HTTPS
# directement sur pi-01, qui n'ecoute qu'en HTTP.
address=/web.expolab.lan/10.42.0.1

# Meme redirection vers l'hote pour le domaine public signe (TLS_MODE=signed,
# voir deploy-server.sh) - fichier gere par deploy-server.sh, vide en
# TLS_MODE=internal. Doit exister (dnsmasq refuse de demarrer sinon, meme
# contrainte que dhcp-hostsfile ci-dessus).
conf-file=/etc/dnsmasq.d/public-domain.conf

# dnsmasq tourne en avant-plan (-k) dans un conteneur sans syslog : sans
# log-facility=- ses journaux (DHCPDISCOVER/OFFER/ACK, "client provides
# name", conflits de reservation) ne vont nulle part et `docker logs` reste vide.
log-facility=-
log-dhcp
