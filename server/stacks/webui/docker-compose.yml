# Stack Dockhand "webui" - app Flask de gestion de la flotte de faux Pi.
services:
  webui:
    build: ${REPO_ROOT}/webui
    container_name: expolab-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      # Socket Incus DIRECT sur l'hote - un seul montage (plus le
      # double-hop hote -> conteneur Incus -> conteneur Docker d'avant,
      # ni les histoires de shift= qui allaient avec).
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - ${REPO_ROOT}/fleet:/expolab/fleet
      # deploy-fleet.sh (lance d'ici) pousse dans chaque faux Pi la
      # configuration commune (image/machine-setup.sh) et la cle PUBLIQUE
      # d'automatisation - jamais la privee. Chemins identiques a ceux de
      # l'hote par rapport a REPO_ROOT (= /expolab ici). Le fichier de cle
      # existe toujours avant ce conteneur (genere par deploy-fleet.sh ou
      # deploy-server.sh), sinon Docker en ferait un dossier.
      - ${REPO_ROOT}/image:/expolab/image:ro
      - ${REPO_ROOT}/server/stacks/ansible-web/automation_key/automation_ed25519.pub:/expolab/server/stacks/ansible-web/automation_key/automation_ed25519.pub:ro
