# Stack Dockhand "bastion" - dashboard + SSH/VNC web
# (https://github.com/nopalpite/bastion). Secrets generes une seule fois
# par deploy-server.sh dans bastion.env (non versionne, a cote de ce
# fichier) ; inventaire de machines + plans dans config/ et maps/
# (egalement non versionnes, propres a chaque lab).
services:
  bastion:
    image: ghcr.io/nopalpite/bastion:latest
    container_name: bastion
    restart: unless-stopped
    # network_mode: host, comme dnsmasq/caddy - recommande par le projet
    # lui-meme pour un bastion (memes interfaces/routes que l'hote, pas
    # de surprise de routage vers expo-lan).
    network_mode: host
    env_file:
      # Inclut BASTION_ADMIN_USER et BASTION_ADMIN_PASSWORD (les
      # identifiants d'administration choisis a l'installation, voir
      # server/lib/credentials.sh) - jamais de mot de passe par defaut en
      # dur dans ce depot public, Bastion donnant acces SSH/VNC a tout le parc.
      - ${REPO_ROOT}/server/stacks/bastion/bastion.env
      # Compte SSH par defaut (BASTION_DEFAULT_SSH_USER), ecrit par setup_access_key.
      - ${REPO_ROOT}/server/stacks/bastion/access_key/access.env
    environment:
      - BASTION_VNC_WS_PORT=6080
      # TLS termine par Caddy (vhost bastion.web.expolab.lan, voir
      # services.yaml) - chemin a faire suivre pour le pont VNC, "option
      # B" de la section "Derriere un reverse proxy" du README de
      # Bastion. Ne PAS activer BASTION_TLS_SELFSIGNED en plus : les
      # deux approches ne se combinent pas.
      - BASTION_VNC_WS_PATH=/vnc-ws/
      - BASTION_HISTORY_RETENTION_DAYS=30
      # Cle SSH PAR DEFAUT des machines (voir la fonction correspondante de Bastion) : la
      # cle d'acces generee par deploy-server.sh, dont le flasheur injecte la partie
      # publique dans chaque carte. Distincte de la cle d'automatisation d'Ansible.
      - BASTION_DEFAULT_SSH_KEY_FILE=/run/keys/bastion_ed25519
    volumes:
      # Fuseau horaire de l'hote (un conteneur est en UTC sinon) : memes heures partout.
      - /etc/localtime:/etc/localtime:ro
      - ${REPO_ROOT}/server/stacks/bastion/config:/app/config
      - ${REPO_ROOT}/server/stacks/bastion/maps:/app/static/uploads/maps
      - ${REPO_ROOT}/server/stacks/bastion/access_key/bastion_ed25519:/run/keys/bastion_ed25519:ro
      # DNS = dnsmasq de l'expo (voir resolv.conf) : le DNS inverse nomme les
      # machines au scan reseau. Celui de l'hote ne les connait pas.
      - ${REPO_ROOT}/server/stacks/bastion/resolv.conf:/etc/resolv.conf:ro
